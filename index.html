<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Super Mega Crossword</title>
<style>
:root{--bg:#fff;--fg:#000;--cell:#fff;--blk:#000;--line:#8a8a94;--hl:#a7d8ff;--cur:#ffda00;--bar:#a7d8ff;--key:#fff;--keyb:#dcdcdc;--sk:#bbbdc1;--sks:#8d8f95;--ksh:#898b8f;--pen:#DE8900;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--fg:#fff;--cell:#55555f;--blk:#18181c;--line:#2a2a33;--hl:#4b3f9e;--cur:#4a7fc1;--bar:#3a3265;--key:#3b3b3f;--keyb:#000;--sk:#232326;--sks:#74747b;--ksh:#000}}
:root[data-theme=dark]{--bg:#000;--fg:#fff;--cell:#55555f;--blk:#18181c;--line:#2a2a33;--hl:#4b3f9e;--cur:#4a7fc1;--bar:#3a3265;--key:#3b3b3f;--keyb:#000;--sk:#232326;--sks:#74747b;--ksh:#000}
html,body{height:100%;margin:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button,#kb,#bar,header,#list,#mysw{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}body{background:var(--bg);color:var(--fg);font:16px -apple-system,Helvetica,sans-serif;display:flex;flex-direction:column;height:100%;overflow:hidden}
header{display:flex;align-items:center;gap:6px;padding:8px 10px}header span{flex:1}button{font:inherit;color:inherit;background:none;border:0;padding:6px 9px;border-radius:8px;cursor:pointer}button.on{background:var(--hl)}
#gw{flex:1;overflow:auto;touch-action:pan-x pan-y;background:var(--blk)}#g{display:grid;width:max-content;margin:auto}
.c span,.bx,.ms{white-space:nowrap}.c{width:var(--cs);height:var(--cs);box-sizing:border-box;border:1px solid var(--line);background:var(--cell);position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cs)*.6);user-select:none}
.c.b{background:var(--blk)}.c.h{background:var(--hl)}.c.s{background:var(--cur)}.c.p{color:var(--pen)}.c i{position:absolute;left:2px;top:0;font-style:normal;font-size:calc(var(--cs)*.28);line-height:1.1}
#bar{background:var(--bar);display:flex;align-items:center;padding:10px;gap:8px;min-height:44px}#bar b{flex:1;font-weight:400;text-align:left;cursor:pointer;font-size:19px;line-height:1.2}#bar button{padding:8px 12px}#pen{font-size:26px;line-height:1}
#kb{--kw:calc((min(100vw,520px) - 60px)/10);background:var(--keyb);padding:2px 0 8px}#kb div{display:flex;justify-content:center;margin-bottom:7px}#kb div:last-child{margin-bottom:0}#kb button{width:var(--kw);height:49px;margin:0 3px;padding:0;border-radius:5px;background:var(--key);box-shadow:0 1.5px 0 var(--ksh);font:400 22px/1 Helvetica,Arial,sans-serif;color:var(--fg);display:flex;align-items:center;justify-content:center}#kb button.sp{width:calc(var(--kw)*1.4);margin:0 6px;background:var(--sk)}#kb button.sp.on{background:var(--sks)}#kb #rb{font-size:13px}
#list{flex:1;overflow:auto;padding:0 14px}#list h3{position:sticky;z-index:5;top:0;background:var(--bar);margin:0;padding:10px;cursor:pointer}.it{content-visibility:auto;contain-intrinsic-size:auto 80px;padding:10px 4px 12px;border-bottom:1px solid var(--line);cursor:pointer;scroll-margin-top:44px}.it.sel{background:var(--hl)}.cn{font-weight:700;opacity:.5}.bx{position:relative}body.hint .c.gn::after,body.hint .bx.gn::after{content:'';position:absolute;inset:0;background:rgba(40,201,0,.3);pointer-events:none}body.hint .gf{outline:2px solid #28c900;outline-offset:-2px;z-index:1}#bar b.cn{flex:none;font-weight:700}.bxs{display:flex;flex-wrap:wrap;margin-top:6px}.bx{width:30px;height:30px;box-sizing:border-box;border:1px solid color-mix(in srgb,var(--fg) 55%,transparent);background:var(--cell);display:flex;align-items:center;justify-content:center;font-size:18px}.bx.p{color:var(--pen)}.bx.s{background:var(--cur)}
dialog{background:var(--bg);color:var(--fg);max-width:92vw}textarea{width:80vw;max-width:700px;height:40vh;background:var(--cell);color:var(--fg)}.hide{display:none!important}

body{font-family:'NYTFranklin',-apple-system,Helvetica,Arial,sans-serif;font-weight:500}
header{display:grid;grid-template-columns:1fr auto 1fr}.hl,.hr{display:flex;align-items:center}.hr{justify-content:flex-end}

.scr{position:fixed;inset:0;background:#fbd300;color:#000;z-index:100;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);font-family:'NYTFranklin',Helvetica,Arial,sans-serif}
.scr .mid{margin:auto 0;display:flex;flex-direction:column;align-items:center}.scr .bot{padding-bottom:23px;display:flex;flex-direction:column;align-items:center}
.logo{width:200px}.logo svg{display:block;width:100%;height:auto}
.t1{font-family:'NYTMagSlab',serif;font-weight:700;font-size:min(85px,21vw);line-height:.85;margin-top:18px;white-space:nowrap}
.t2{font-weight:800;font-size:21px;margin-top:14px}.btns{margin-top:52px;display:flex;flex-direction:column;gap:8px}
.pill{width:165px;height:49px;border-radius:69px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box;padding:0;border:1.5px solid #000;color:#000;background:transparent;cursor:pointer}.pill.fill{background:#000;color:#fff}
.btns2{margin-top:55px;display:flex;gap:4px}.pill2{width:131px;height:49px;border-radius:69px;background:#000;color:#fff;border:1.5px solid #000;font:600 16px 'NYTFranklin',Helvetica,Arial,sans-serif;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.rr{display:flex;align-items:center;width:100vw;margin-bottom:22px}.rr:before,.rr:after{content:'';flex:1;height:1.5px;background:#b19400}.pill.rp{width:123px;height:33px;border-color:#b19400;flex:none}#st .ends{margin-bottom:25px}
.ends{font-weight:800;font-size:16px;text-align:center;margin-bottom:20px}
.cd{display:flex;justify-content:center;gap:4px;width:356px;max-width:96vw}.cd>div{position:relative;width:68px;height:62px;display:flex;flex-direction:column;align-items:center}
.cd>div+div::before{content:'';position:absolute;left:-2.75px;top:0;height:62px;width:1.5px;background:#b19400}
.cd b{font-family:'NYTMagSlab',serif;font-weight:700;font-size:48px;line-height:1}.cd i{position:absolute;left:0;right:0;top:48.85px;text-align:center;font-style:normal;font-weight:600;font-size:14px;line-height:1}
.ovx{position:absolute;top:calc(60px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:0;width:34px;height:34px}

function tickCd(){const v=cdVals(),L=['month','day','hour','minute','second'];document.querySelectorAll('.cd').forEach(c=>{[...c.children].forEach((el,i)=>{const n=v[i],t=i>=3?String(n).padStart(2,'0'):String(n),l=L[i]+(n===1?'':'s');if(el._n!==t){el._n=t;el.firstChild.textContent=t}if(el._l!==l){el._l=l;el.lastChild.textContent=l}})})}
document.querySelectorAll('.cd').forEach(c=>c.innerHTML='<div><b></b><i></i></div>'.repeat(5));tickCd();setInterval(tickCd,1000);
